<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria Familiar</title>

<style>
:root {
  --p: #181d27;
  --p2: #202735;
  --t: #f4f7fb;
  --m: #aeb8c8;
  --a: #79b8ff;
  --l: #30394a;
  --g: #2d7d4e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: linear-gradient(135deg, #0e1117, #182234);
  color: var(--t);
  font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 28px 18px 55px;
}

.hero { padding: 12px 0 22px; }

.eyebrow {
  color: var(--a);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-size: .78rem;
}

.hero h1 {
  font-size: clamp(2.1rem, 5vw, 4.2rem);
  margin: 8px 0;
}

.hero p {
  color: var(--m);
  margin: 0;
  max-width: 760px;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  background: rgba(24, 29, 39, .92);
  border: 1px solid var(--l);
  padding: 14px;
  border-radius: 18px;
  position: sticky;
  top: 10px;
  z-index: 3;
}

input, select, button, .button {
  border: 1px solid var(--l);
  border-radius: 11px;
  background: var(--p2);
  color: var(--t);
  padding: 11px 13px;
  font: inherit;
  text-decoration: none;
}

input {
  flex: 1;
  min-width: 200px;
}

button, .button { cursor: pointer; }

.connect, .download {
  background: var(--g);
  border-color: #53bd7d;
  font-weight: 700;
}

.status {
  color: var(--m);
  font-size: .92rem;
  margin: 18px 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
}

.card {
  background: var(--p);
  border: 1px solid var(--l);
  border-radius: 17px;
  overflow: hidden;
  transition: .2s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--a);
}

.thumb {
  height: 170px;
  background: #252d3c;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.folder-icon { font-size: 4rem; }

.body { padding: 13px; }

.name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.meta {
  font-size: .82rem;
  color: var(--m);
  margin-top: 5px;
}

.empty {
  padding: 35px;
  text-align: center;
  color: var(--m);
  border: 1px dashed var(--l);
  border-radius: 15px;
}

.hidden { display: none !important; }

.back {
  margin-bottom: 16px;
  display: none;
}

dialog {
  width: min(1200px, 96vw);
  height: min(92vh, 900px);
  padding: 0;
  border: 1px solid var(--l);
  border-radius: 18px;
  background: #0b0e14;
  color: var(--t);
}

dialog::backdrop {
  background: rgba(0, 0, 0, .84);
}

.viewer {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 16px;
}

.viewer-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.viewer h2 {
  margin: 0;
  font-size: 1.05rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.viewer-main {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 12px 56px;
}

.media {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 9px;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 52px;
  padding: 0;
  border-radius: 14px;
  background: rgba(32, 39, 53, .9);
  font-size: 2rem;
  line-height: 1;
}

.previous { left: 0; }
.next { right: 0; }

.viewer-foot {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 8px;
}

.counter {
  padding: 7px 11px;
  background: #171d28;
  border-radius: 999px;
  color: var(--m);
  font-size: .88rem;
}

@media (max-width: 600px) {
  .toolbar { position: static; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .thumb { height: 125px; }
  .viewer { padding: 12px; }
  .viewer-main { padding: 10px 39px; }
  .nav { width: 34px; height: 44px; font-size: 1.5rem; }
}
</style>
</head>

<body>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Coleccion familiar · Drive</div>
    <h1>Galeria Familiar</h1>
    <p>Explora las carpetas, fotos y videos de tu Google Drive. Tus archivos solo se cargan después de que autorices el acceso con tu cuenta.</p>
  </section>

  <button id="back" class="back" type="button">← Volver a carpetas</button>

  <section class="toolbar">
    <button id="connect" class="connect" type="button" disabled>Preparando Google…</button>

    <input id="search" type="search" placeholder="Buscar por nombre…" disabled>

    <select id="type" disabled>
      <option value="all">Todo</option>
      <option value="image">Fotos</option>
      <option value="video">Videos</option>
    </select>

    <select id="sort" disabled>
      <option value="name">Nombre A–Z</option>
      <option value="date">Fecha más reciente</option>
    </select>
  </section>

  <div id="status" class="status">Cargando Google…</div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty hidden">No hay elementos que coincidan con la búsqueda.</div>
</main>

<dialog id="dialog">
  <div class="viewer">
    <div class="viewer-head">
      <h2 id="viewerTitle"></h2>
      <button id="close" type="button">Cerrar</button>
    </div>

    <div class="viewer-main">
      <button id="previous" class="nav previous" type="button">‹</button>
      <div id="viewerContent"></div>
      <button id="next" class="nav next" type="button">›</button>
    </div>

    <div class="viewer-foot">
      <span id="counter" class="counter"></span>
      <a id="download" class="button download" download>Descargar</a>
    </div>
  </div>
</dialog>

<script>
const CLIENT_ID = '732021653288-tg8cqp92dkdcfn4u0gt759d5n9m0556o.apps.googleusercontent.com';
const ROOT_FOLDER_ID = '12KuHtLGS24vgNTOyFQu6c1JHF619bpvE';
const SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

let tokenClient = null;
let accessToken = '';
let items = [];
let visibleItems = [];
let currentFolder = {
  id: ROOT_FOLDER_ID,
  name: 'Fotos Familiares'
};
let history = [];
let viewerIndex = 0;

const $ = id => document.getElementById(id);

const esc = value => String(value).replace(/[&<>'"]/g, character => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  "'": '&#39;',
  '"': '&quot;'
}[character]));

function status(text) {
  $('status').textContent = text;
}

function formatDate(value) {
  return new Date(value).toLocaleDateString('es-CO', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

function enableControls() {
  ['search', 'type', 'sort'].forEach(id => {
    $(id).disabled = false;
  });

  $('connect').disabled = false;
  $('connect').textContent = 'Conectar con Google Drive';
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,

    callback: async response => {
      if (response.error) {
        status('Autorización cancelada: ' + response.error);
        return;
      }

      accessToken = response.access_token;
      $('connect').textContent = 'Drive conectado';
      enableControls();

      history = [];
      currentFolder = {
        id: ROOT_FOLDER_ID,
        name: 'Fotos Familiares'
      };

      await loadFolder();
    }
  });

  enableControls();
  status('Listo. Pulsa “Conectar con Google Drive”.');
}

function connectDrive() {
  if (!tokenClient) {
    status('Google todavía está cargando…');
    return;
  }

  status('Abriendo autorización de Google…');

  tokenClient.requestAccessToken({
    prompt: accessToken ? '' : 'consent'
  });
}

async function api(url) {
  const response = await fetch(url, {
    headers: {
      Authorization: 'Bearer ' + accessToken
    }
  });

  if (!response.ok) {
    const data = await response.json();
    throw new Error(data.error?.message || 'Error al consultar Drive');
  }

  return response.json();
}

async function loadFolder() {
  status('Cargando “' + currentFolder.name + '”…');

  try {
    const query = encodeURIComponent(
      `'${currentFolder.id}' in parents and trashed = false`
    );

    const fields = encodeURIComponent(
      'files(id,name,mimeType,modifiedTime,thumbnailLink)'
    );

    const data = await api(
      `https://www.googleapis.com/drive/v3/files?q=${query}&fields=${fields}&orderBy=folder,name&pageSize=1000`
    );

    items = data.files || [];
    render();

    status(
      `${items.length} elemento${items.length === 1 ? '' : 's'} en “${currentFolder.name}”`
    );
  } catch (error) {
    status('Error: ' + error.message);
  }
}

function kind(file) {
  if (file.mimeType === 'application/vnd.google-apps.folder') return 'folder';
  if (file.mimeType.startsWith('image/')) return 'image';
  if (file.mimeType.startsWith('video/')) return 'video';
  return 'file';
}

function render() {
  const search = $('search').value.toLowerCase().trim();
  const filter = $('type').value;

  visibleItems = items
    .filter(file => {
      return file.name.toLowerCase().includes(search) &&
        (filter === 'all' || kind(file) === filter);
    })
    .sort((a, b) => {
      if ($('sort').value === 'date') {
        return new Date(b.modifiedTime) - new Date(a.modifiedTime);
      }

      return a.name.localeCompare(b.name, 'es');
    });

  $('grid').innerHTML = visibleItems.map(createCard).join('');
  $('empty').classList.toggle('hidden', visibleItems.length > 0);
  $('back').style.display = history.length ? 'inline-block' : 'none';
}

function createCard(file) {
  const type = kind(file);
  const name = esc(file.name);

  const meta = `${
    type === 'folder'
      ? 'Carpeta'
      : type === 'image'
      ? 'Foto'
      : type === 'video'
      ? 'Video'
      : 'Archivo'
  } · ${formatDate(file.modifiedTime)}`;

  let preview = '<div class="folder-icon">📁</div>';

  if (type === 'image') {
    const thumbnail = file.thumbnailLink ||
      `https://drive.google.com/thumbnail?id=${file.id}&sz=w1000`;

    preview = `<img loading="lazy" src="${thumbnail}" alt="${name}">`;
  }

  if (type === 'video') {
    preview = '<div class="folder-icon">▶️</div>';
  }

  return `
    <article class="card" data-id="${file.id}">
      <div class="thumb">${preview}</div>
      <div class="body">
        <div class="name">${name}</div>
        <div class="meta">${meta}</div>
      </div>
    </article>
  `;
}

function mediaFiles() {
  return visibleItems.filter(file => {
    return ['image', 'video'].includes(kind(file));
  });
}

function openItem(id) {
  const file = items.find(item => item.id === id);
  const type = kind(file);

  if (type === 'folder') {
    history.push(currentFolder);

    currentFolder = {
      id: file.id,
      name: file.name
    };

    $('search').value = '';
    $('type').value = 'all';
    loadFolder();
    return;
  }

  if (type === 'image' || type === 'video') {
    viewerIndex = mediaFiles().findIndex(item => item.id === id);
    showViewer();
  }
}

function showViewer() {
  const files = mediaFiles();

  if (!files.length) return;

  viewerIndex = (viewerIndex + files.length) % files.length;

  const file = files[viewerIndex];
  const type = kind(file);
  const previewUrl = `https://drive.google.com/uc?export=view&id=${file.id}`;

  $('viewerTitle').textContent = file.name;

  $('viewerContent').innerHTML = type === 'video'
    ? `<video class="media" src="${previewUrl}" controls autoplay></video>`
    : `<img class="media" src="${previewUrl}" alt="${esc(file.name)}">`;

  $('download').href =
    `https://drive.usercontent.google.com/download?id=${file.id}&export=download&confirm=t`;

  $('download').setAttribute('download', file.name);

  $('counter').textContent = `${viewerIndex + 1} de ${files.length}`;

  $('previous').classList.toggle('hidden', files.length < 2);
  $('next').classList.toggle('hidden', files.length < 2);

  if (!$('dialog').open) {
    $('dialog').showModal();
  }
}

function changeViewer(step) {
  viewerIndex += step;
  showViewer();
}

$('connect').onclick = connectDrive;

$('close').onclick = () => {
  $('dialog').close();
  $('viewerContent').innerHTML = '';
};

$('previous').onclick = () => changeViewer(-1);
$('next').onclick = () => changeViewer(1);

$('back').onclick = () => {
  currentFolder = history.pop();
  $('search').value = '';
  $('type').value = 'all';
  loadFolder();
};

$('grid').onclick = event => {
  const card = event.target.closest('.card');

  if (card) {
    openItem(card.dataset.id);
  }
};

['search', 'type', 'sort'].forEach(id => {
  $(id).addEventListener('input', render);
});

document.addEventListener('keydown', event => {
  if (!$('dialog').open) return;

  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    changeViewer(-1);
  }

  if (event.key === 'ArrowRight') {
    event.preventDefault();
    changeViewer(1);
  }
});
</script>

<script
  async
  defer
  src="https://accounts.google.com/gsi/client"
  onload="gisLoaded()"
  onerror="document.getElementById('status').textContent='No se pudo cargar Google Identity Services.'">
</script>

</body>
</html>
