<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria Familiar</title>
<style>
:root{--panel:#181d27;--panel2:#202735;--text:#f4f7fb;--muted:#aeb8c8;--accent:#79b8ff;--line:#30394a;--green:#2d7d4e}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0e1117,#182234);color:var(--text);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:28px 18px 55px}
.hero{padding:12px 0 22px}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
.hero h1{font-size:clamp(2.1rem,5vw,4.2rem);margin:8px 0}
.hero p{color:var(--muted);margin:0;max-width:760px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:rgba(24,29,39,.92);border:1px solid var(--line);padding:14px;border-radius:18px;position:sticky;top:10px;z-index:3;backdrop-filter:blur(12px)}
input,select,button,.button{border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:11px 13px;font:inherit;text-decoration:none}
input{flex:1;min-width:200px}
button,.button{cursor:pointer}
button:hover,.button:hover{border-color:var(--accent)}
.connect,.download{background:var(--green);border-color:#53bd7d;font-weight:700}
.status{color:var(--muted);font-size:.92rem;margin:18px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{height:170px;background:#252d3c;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.folder-icon{font-size:4rem}
.body{padding:13px}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.82rem;color:var(--muted);margin-top:5px}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}
.hidden{display:none!important}
.back{margin-bottom:16px;display:none}
dialog{width:min(1200px,96vw);height:min(92vh,900px);padding:0;border:1px solid var(--line);border-radius:18px;background:#0b0e14;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.84)}
.viewer{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:16px}
.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.viewer h2{margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-main{position:relative;min-height:0;display:grid;place-items:center;padding:12px 56px}
.media{max-width:100%;max-height:100%;object-fit:contain;border-radius:9px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:52px;padding:0;border-radius:14px;background:rgba(32,39,53,.9);font-size:2rem;line-height:1}
.previous{left:0}
.next{right:0}
.viewer-foot{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px}
.counter{padding:7px 11px;background:#171d28;border-radius:999px;color:var(--muted);font-size:.88rem}
@media(max-width:600px){
  .toolbar{position:static}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .thumb{height:125px}
  .body{padding:10px}
  .name{font-size:.9rem}
  .viewer{padding:12px}
  .viewer-main{padding:10px 39px}
  .nav{width:34px;height:44px;font-size:1.5rem}
}
</style>
</head>
<body>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Coleccion familiar · Drive</div>
    <h1>Galeria Familiar</h1>
    <p>Explora las carpetas, fotos y videos de tu Google Drive. Tus archivos solo se cargan después de que autorices el acceso con tu cuenta.</p>
  </section>

  <button id="back" class="back">← Volver a carpetas</button>

  <section class="toolbar">
    <button id="connect" class="connect">Conectar con Google Drive</button>
    <input id="search" type="search" placeholder="Buscar por nombre…" disabled>
    <select id="type" disabled>
      <option value="all">Todo</option>
      <option value="image">Fotos</option>
      <option value="video">Videos</option>
    </select>
    <select id="sort" disabled>
      <option value="name">Nombre A–Z</option>
      <option value="date">Fecha más reciente</option>
    </select>
  </section>

  <div id="status" class="status">Conecta tu cuenta para ver la carpeta Fotos Familiares.</div>
  <section
    pages build and deployment / deploy
