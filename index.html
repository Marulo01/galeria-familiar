<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria Familiar</title>
<style>
:root{--p:#181d27;--p2:#202735;--t:#f4f7fb;--m:#aeb8c8;--a:#79b8ff;--l:#30394a;--g:#2d7d4e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0e1117,#182234);color:var(--t);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px 55px}.hero{padding:12px 0 22px}.eyebrow{color:var(--a);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(2.1rem,5vw,4.2rem);margin:8px 0}.hero p{color:var(--m);margin:0;max-width:760px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:rgba(24,29,39,.92);border:1px solid var(--l);padding:14px;border-radius:18px;position:sticky;top:10px;z-index:3}input,select,button,.button{border:1px solid var(--l);border-radius:11px;background:var(--p2);color:var(--t);padding:11px 13px;font:inherit;text-decoration:none}input{flex:1;min-width:200px}button,.button{cursor:pointer}.connect,.download{background:var(--g);border-color:#53bd7d;font-weight:700}.status{color:var(--m);font-size:.92rem;margin:18px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:var(--a)}.thumb{height:170px;background:#252d3c;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.folder-icon{font-size:4rem}.body{padding:13px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:.82rem;color:var(--m);margin-top:5px}.empty{padding:35px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:15px}.hidden{display:none!important}.back{margin-bottom:16px;display:none}dialog{width:min(1200px,96vw);height:min(92vh,900px);padding:0;border:1px solid var(--l);border-radius:18px;background:#0b0e14;color:var(--t)}dialog::backdrop{background:rgba(0,0,0,.84)}.viewer{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:16px}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.viewer h2{margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-main{position:relative;min-height:0;display:grid;place-items:center;padding:12px 56px}.media{max-width:100%;max-height:100%;object-fit:contain;border-radius:9px}.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:52px;padding:0;border-radius:14px;background:rgba(32,39,53,.9);font-size:2rem;line-height:1}.previous{left:0}.next{right:0}.viewer-foot{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px}.counter{padding:7px 11px;background:#171d28;border-radius:999px;color:var(--m);font-size:.88rem}@media(max-width:600px){.toolbar{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:125px}.viewer{padding:12px}.viewer-main{padding:10px 39px}.nav{width:34px;height:44px;font-size:1.5rem}}
</style>
</head>
<body>
<main class="wrap"><section class="hero"><div class="eyebrow">Coleccion familiar · Drive</div><h1>Galeria Familiar</h1><p>Explora las carpetas, fotos y videos de tu Google Drive. Tus archivos solo se cargan después de que autorices el acceso con tu cuenta.</p></section><button id="back" class="back">← Volver a carpetas</button><section class="toolbar"><button id="connect" class="connect" type="button">Conectar con Google Drive</button><input id="search" type="search" placeholder="Buscar por nombre…" disabled><select id="type" disabled><option value="all">Todo</option><option value="image">Fotos</option><option value="video">Videos</option></select><select id="sort" disabled><option value="name">Nombre A–Z</option><option value="date">Fecha más reciente</option></select></section><div id="status" class="status">Cargando el botón de Google…</div><section id="grid" class="grid"></section><div id="empty" class="empty hidden">No hay elementos que coincidan con la búsqueda.</div></main>
<dialog id="dialog"><div class="viewer"><div class="viewer-head"><h2 id="viewerTitle"></h2><button id="close" type="button">Cerrar</button></div><div class="viewer-main"><button id="previous" class="nav previous" type="button">‹</button><div id="viewerContent"></div><button id="next" class="nav next" type="button">›</button></div><div class="viewer-foot"><span id="counter" class="counter"></span><a id="download" class="button download" download>Descargar</a></div></div></dialog>
<script>
const CLIENT_ID='732021653288-tg8cqp92dkdcfn4u0gt759d5n9m0556o.apps.googleusercontent.com';const ROOT_FOLDER_ID='12KuHtLGS24vgNTOyFQu6c1JHF619bpvE';const SCOPE='https://www.googleapis.com/auth/drive.readonly';let tokenClient=null,accessToken='',items=[],visibleItems=[],currentFolder={id:ROOT_FOLDER_ID,name:'Fotos Familiares'},history=[],viewerIndex=0;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function status(x){$('status').textContent=x}function enable(){['search','type','sort'].forEach(id=>$(id).disabled=false)}function date(x){return new Date(x).toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'})}function initializeGoogle(){if(!window.google?.accounts?.oauth2){status('Google aún está cargando… intenta de nuevo.');return false}tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error){status('Autorización cancelada: '+r.error);return}accessToken=r.access_token;$('connect').textContent='Drive conectado';enable();await loadFolder()}});return true}function connect(){if(!tokenClient&&!initializeGoogle())return;status('Abriendo autorización de Google…');tokenClient.requestAccessToken({prompt:accessToken?'':'consent'})}async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});if(!r.ok)throw new Error((await r.json()).error?.message||'Error al consultar Drive');return r.json()}async function loadFolder(){status('Cargando “'+currentFolder.name+'”…');try{const q=encodeURIComponent(`'${currentFolder.id}' in parents and trashed = false`),f=encodeURIComponent('files(id,name,mimeType,modifiedTime,thumbnailLink)');const d=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=${f}&orderBy=folder,name&pageSize=1000`);items=d.files||[];render();status(`${items.length} elemento${items.length===1?'':'s'} en “${currentFolder.name}”`)}catch(e){status('Error: '+e.message)}}function kind(x){if(x.mimeType==='application/vnd.google-apps.folder')return'folder';if(x.mimeType.startsWith('image/'))return'image';if(x.mimeType.startsWith('video/'))return'video';return'file'}function render(){const q=$('search').value.toLowerCase().trim(),f=$('type').value;visibleItems=items.filter(x=>x.name.toLowerCase().includes(q)&&(f==='all'||kind(x)===f)).sort((a,b)=>$('sort').value==='date'?new Date(b.modifiedTime)-new Date(a.modifiedTime):a.name.localeCompare(b.name,'es'));$('grid').innerHTML=visibleItems.map(card).join('');$('empty').classList.toggle('hidden',visibleItems.length>0);$('back').style.display=history.length?'inline-block':'none'}function card(x){const k=kind(x),n=esc(x.name),m=`${k==='folder'?'Carpeta':k==='image'?'Foto':k==='video'?'Video':'Archivo'} · ${date(x.modifiedTime)}`;let p='<div class="folder-icon">📁</div>';if(k==='image')p=`<img loading="lazy" src="${x.thumbnailLink||`https://drive.google.com/thumbnail?id=${x.id}&sz=w1000`}" alt="${n}">`;if(k==='video')p='<div class="folder-icon">▶️</div>';return `<article class="card" data-id="${x.id}"><div class="thumb">${p}</div><div class="body"><div class="name">${n}</div><div class="meta">${m}</div></div></article>`}function media(){return visibleItems.filter(x=>['image','video'].includes(kind(x)))}function openItem(id){const x=items.find(a=>a.id===id),k=kind(x);if(k==='folder'){history.push(currentFolder);currentFolder={id:x.id,name:x.name};$('search').value='';$('type').value='all';loadFolder()}else if(k==='image'||k==='video'){viewerIndex=media().findIndex(a=>a.id===id);show()}}function show(){const a=media();if(!a.length)return;viewerIndex=(viewerIndex+a.length)%a.length;const x=a[viewerIndex],k=kind(x),src=`https://drive.google.com/uc?export=view&id=${x.id}`;$('viewerTitle').textContent=x.name;$('viewerContent').innerHTML=k==='video'?`<video class="media" src="${src}" controls autoplay></video>`:`<img class="media" src="${src}" alt="${esc(x.name)}">`;$('download').href=`https://drive.usercontent.google.com/download?id=${x.id}&export=download&confirm=t`;$('download').setAttribute('download',x.name);$('counter').textContent=`${viewerIndex+1} de ${a.length}`;$('previous').classList.toggle('hidden',a.length<2);$('next').classList.toggle('hidden',a.length<2);if(!$('dialog').open)$('dialog').showModal()}function step(n){viewerIndex+=n;show()}$('connect').onclick=connect;$('close').onclick=()=>{$('dialog').close();$('viewerContent').innerHTML=''};$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('back').onclick=()=>{currentFolder=history.pop();$('search').value='';$('type').value='all';loadFolder()};$('grid').onclick=e=>{const c=e.target.closest('.card');if(c)openItem(c.dataset.id)};['search','type','sort'].forEach(id=>$(id).addEventListener('input',render));document.addEventListener('keydown',e=>{if($('dialog').open&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();step(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('load',()=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{status('Listo. Pulsa “Conectar con Google Drive”.'};s.onerror=()=>status('No se pudo cargar Google. Revisa tu conexión.');document.head.appendChild(s)});
</script>
</body>
</html>
