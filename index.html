<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería familiar</title>
  <style>
    :root{--bg:#10131a;--panel:#181d27;--panel2:#202735;--text:#f4f7fb;--muted:#aeb8c8;--accent:#79b8ff;--line:#30394a}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0e1117,#182234);color:var(--text);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:1200px;margin:auto;padding:28px 18px 50px}.hero{padding:18px 0 24px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(2rem,5vw,4rem);margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:720px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;background:rgba(24,29,39,.9);border:1px solid var(--line);padding:14px;border-radius:18px;position:sticky;top:10px;z-index:2;backdrop-filter:blur(12px)}
    input,select,button{border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:11px 13px;font:inherit}input{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:var(--accent)}
    .status{color:var(--muted);font-size:.9rem;margin:18px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:var(--accent)}.thumb{height:170px;background:#252d3c;display:grid;place-items:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.folder-icon{font-size:4rem}.body{padding:13px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:.82rem;color:var(--muted);margin-top:5px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.hidden{display:none!important}
    dialog{width:min(950px,94vw);padding:0;border:1px solid var(--line);border-radius:18px;background:#0e1219;color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.78)}.viewer{padding:18px}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.viewer h2{margin:0;font-size:1.15rem}.media{max-height:72vh;max-width:100%;display:block;margin:auto;border-radius:10px}.viewer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.download{background:#2d7d4e;border-color:#53bd7d}.back{margin-bottom:16px;display:none}
    @media(max-width:600px){.toolbar{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:125px}.body{padding:10px}.name{font-size:.9rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">Marulo01 · colección de prueba</div><h1>Galería familiar</h1><p>Explora carpetas, fotos y videos. Cuando conectemos Drive, esta misma interfaz cargará automáticamente tu colección.</p></section>
    <button id="back" class="back">← Volver a carpetas</button>
    <section class="toolbar" aria-label="Filtros"><input id="search" type="search" placeholder="Buscar por nombre…"><select id="type"><option value="all">Todo</option><option value="image">Fotos</option><option value="video">Videos</option></select><select id="sort"><option value="name">Nombre A–Z</option><option value="date">Fecha más reciente</option></select></section>
    <div id="status" class="status"></div><section id="grid" class="grid"></section><div id="empty" class="empty hidden">No hay elementos que coincidan con la búsqueda.</div>
  </main>
  <dialog id="dialog"><div class="viewer"><div class="viewer-head"><h2 id="viewerTitle"></h2><button id="close">Cerrar</button></div><div id="viewerContent"></div><div class="viewer-actions"><a id="driveLink" target="_blank" rel="noopener"><button>Abrir en Drive</button></a><a id="download" class="download" download><button>Descargar</button></a></div></div></dialog>
<script>
const ROOT='https://drive.google.com/drive/folders/12KuHtLGS24vgNT0yFQu6c1JHF6l9bpvE';
const folders=[{name:'Drone',date:'2026-08-16',url:ROOT},{name:'Snapseed',date:'2026-08-16',url:ROOT},{name:'Varias',date:'2026-08-16',url:ROOT},{name:'WhatsApp Images',date:'2026-08-16',url:ROOT}];
const demo=[];let current='folders';
const $=id=>document.getElementById(id);const date=x=>new Date(x.date).toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});
function render(){const q=$('search').value.toLowerCase().trim(),kind=$('type').value;let data=current==='folders'?folders:demo;data=data.filter(x=>x.name.toLowerCase().includes(q)&& (kind==='all'||x.type===kind||current==='folders'));data=[...data].sort((a,b)=>$('sort').value==='date'?new Date(b.date)-new Date(a.date):a.name.localeCompare(b.name,'es'));$('grid').innerHTML=data.map(x=>current==='folders'?folderCard(x):mediaCard(x)).join('');$('status').textContent=`${data.length} elemento${data.length===1?'':'s'} · ${current==='folders'?'carpetas':'archivos'}`;$('empty').classList.toggle('hidden',data.length>0);$('back').style.display=current==='folders'?'none':'inline-block';}
function folderCard(x){return `<article class="card" onclick="openFolder('${x.name.replaceAll("'","\\'")}')"><div class="thumb"><div class="folder-icon">📁</div></div><div class="body"><div class="name">${x.name}</div><div class="meta">Carpeta · ${date(x)}</div></div></article>`}
function mediaCard(x){return `<article class="card" onclick="view('${x.name.replaceAll("'","\\'")}')"><div class="thumb">${x.type==='video'?`<video src="${x.url}" muted></video>`:`<img src="${x.url}" alt="${x.name}">`}</div><div class="body"><div class="name">${x.name}</div><div class="meta">${x.type==='video'?'Video':'Foto'} · ${date(x)}</div></div></article>`}
function openFolder(name){current=name;render()}function view(name){const x=demo.find(y=>y.name===name);if(!x)return;$('viewerTitle').textContent=x.name;$('viewerContent').innerHTML=x.type==='video'?`<video class="media" src="${x.url}" controls autoplay></video>`:`<img class="media" src="${x.url}" alt="${x.name}">`;$('driveLink').href=x.drive||x.url;$('download').href=x.url;$('dialog').showModal()}
$('close').onclick=()=> $('dialog').close();$('back').onclick=()=>{current='folders';$('search').value='';$('type').value='all';render()};['search','type','sort'].forEach(id=>$(id).addEventListener('input',render));render();
</script></body></html>
